    <section class="container">
      <div class="contact-cards">
        <div class="c-card reveal">

          <h3 data-i18n="contact.wa"></h3>
          <div class="val" data-text="whatsappOrdersDisplay">+20 114 424 6362</div>
          <a class="link-btn" data-link="wa-orders" href="https://wa.me/201144246362" target="_blank" rel="noopener"><span data-i18n="contact.chat"></span> →</a>
        </div>
        <div class="c-card reveal" style="--d:80ms">
          <div class="c-ic pay"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg></div>
          <h3 data-i18n="contact.wa.pay"></h3>
          <div class="val" data-text="whatsappPaymentsDisplay">+20 101 504 4457</div>
          <a class="link-btn" data-link="wa-payments" href="https://wa.me/201015044457" target="_blank" rel="noopener"><span data-i18n="contact.chat"></span> →</a>
        </div>
        <div class="c-card reveal" style="--d:160ms">
          <div class="c-ic mail"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
          <h3 data-i18n="contact.email"></h3>

          <a class="link-btn" data-link="email" href="mailto:tes.korea2013@gmail.com">✉ <span>Email</span> →</a>
        </div>
      </div>

    <section class="section">
      <div class="container contact-grid">
        <div class="co-card">
          <h3 data-i18n="contact.form"></h3>
          <form id="contact-form" class="contact-form" novalidate>
            <div class="fields">
              <label class="field"><span><span data-i18n="co.name"></span> *</span><input name="name" required autocomplete="name"></label>
              <label class="field"><span data-i18n="co.phone"></span><input name="phone" type="tel" dir="ltr" autocomplete="tel"></label>
              <label class="field full"><span data-i18n="news.email"></span><input name="email" type="email" dir="ltr" autocomplete="email"></label>
              <label class="field full"><span data-i18n="contact.subject"></span><input name="subject"></label>
              <label class="field full"><span><span data-i18n="contact.message"></span> *</span><textarea name="message" rows="5" required></textarea></label>
            </div>
            <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
            <p class="form-msg" role="status"></p>
            <button class="btn btn-gold lg" type="submit"><span data-i18n="contact.send"></span></button>
          </form>
        </div>
        <aside class="contact-side">
          <div class="side-card">
            <h3 data-i18n="contact.social"></h3>
            <div class="side-socials">
              <a data-link="facebook" href="https://www.facebook.com/share/1AG4K3YahV/" target="_blank" rel="noopener"><span class="si" style="background:#1877F2"><svg class="ic" viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4 1.8-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.6c0-.4.3-.6.6-.6z" fill="currentColor"/></svg></span><span>Facebook</span><span>The Elf Shop</span></a>

              <a data-link="tiktok" href="https://www.tiktok.com/@theelfshop4" target="_blank" rel="noopener"><span class="si" style="background:#111"><svg class="ic" viewBox="0 0 24 24"><path d="M15.5 3c.3 2.2 1.8 3.8 4.2 4v3.2c-1.5 0-2.9-.4-4.2-1.2v6a6 6 0 1 1-6-6v3.3a2.8 2.8 0 1 0 2.8 2.7V3z" fill="currentColor"/></svg></span><span>TikTok</span><span>@theelfshop4</span></a>
            </div>
          </div>
          <div class="side-card">
            <h3 data-i18n="about.locations"></h3>
            <div class="f-loc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="loc.seoul"></span></div>
            <div class="f-loc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="loc.alex"></span></div>
